name: 🔐 Encrypt Report (one-time / re-key)

on:
  # Manual trigger only — run this once after setting REPORT_PASSWORD
  workflow_dispatch:

jobs:
  encrypt:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wrap report in password gate
        env:
          REPORT_PASSWORD: ${{ secrets.REPORT_PASSWORD }}
        run: |
          echo "🔐 Wrapping index_raw.html with password gate..."
          python make_gate.py \
            --html         index_raw.html \
            --password-env REPORT_PASSWORD \
            --out          index.html
          echo "✅ Gate HTML generated!"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "ℹ️ No changes to commit."
          else
            TIMESTAMP=$(TZ='Asia/Ho_Chi_Minh' date +'%d/%m/%Y %H:%M')
            git commit -m "🔐 Rebuild password gate — $TIMESTAMP ICT"
            git push
            echo "✅ Pushed!"
          fi
